name: publish

# Release flow: bump <Version> in Directory.Build.props, commit, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Publishes BOTH packages (core first, then AspNetCore) to NuGet via Trusted Publishing (OIDC) —
# no stored API key.
# One-time setup:
#   1. nuget.org → account → Trusted Publishing → create a policy:
#        package owner = <you>, repo owner = RideBuilder, repo = affiliate-dotnet, workflow = publish.yml
#   2. add a repo VARIABLE (not secret) NUGET_USER = your nuget.org username
#      (Settings → Secrets and variables → Actions → Variables → New repository variable)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for NuGet Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)
          echo "tag=$TAG props=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != <Version> $VER"; exit 1; }

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: |
          dotnet pack src/RideBuilder.Affiliate/RideBuilder.Affiliate.csproj -c Release -o artifacts
          dotnet pack src/RideBuilder.Affiliate.AspNetCore/RideBuilder.Affiliate.AspNetCore.csproj -c Release -o artifacts

      - name: NuGet login (OIDC → short-lived key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push (core first, then AspNetCore; .snupkg symbols follow automatically)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          dotnet nuget push "artifacts/RideBuilder.Affiliate.${VER}.nupkg"          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/RideBuilder.Affiliate.AspNetCore.${VER}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
